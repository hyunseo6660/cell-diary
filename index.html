<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>감정세포 일기</title>
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg:       #0b0b1e;
      --surface:  rgba(255,255,255,0.06);
      --border:   rgba(255,255,255,0.10);
      --text:     rgba(255,255,255,0.92);
      --muted:    rgba(255,255,255,0.42);
      --dim:      rgba(255,255,255,0.22);
      --purple:   #c084fc;
      --red:      #f87171;
      --blue:     #93c5fd;
      --gray:     #94a3b8;
      --orange:   #fdba74;
      --pink:     #f9a8d4;
    }

    html, body {
      height: 100%; overflow: hidden;
      background: var(--bg);
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      color: var(--text);
    }

    /* Fixed background blobs */
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 65% 55% at 12% 18%, rgba(110,55,210,0.22) 0%, transparent 100%),
        radial-gradient(ellipse 55% 65% at 88% 75%, rgba(55,90,210,0.18) 0%, transparent 100%),
        radial-gradient(ellipse 45% 40% at 58% 8%,  rgba(210,75,155,0.13) 0%, transparent 100%),
        radial-gradient(ellipse 40% 35% at 80% 30%, rgba(90,55,210,0.10) 0%, transparent 100%);
    }

    /* ── Screen system ── */
    .screen {
      position: fixed; inset: 0;
      display: none; flex-direction: column;
      z-index: 1;
    }
    .screen.active {
      display: flex;
      animation: screenIn 0.22s ease forwards;
    }
    @keyframes screenIn {
      from { opacity: 0; transform: translateX(18px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .screen.back-in {
      animation: backIn 0.22s ease forwards;
    }
    @keyframes backIn {
      from { opacity: 0; transform: translateX(-18px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ── App bar ── */
    .app-bar {
      height: 86px;
      display: flex; align-items: flex-end;
      padding: 0 16px 16px;
      flex-shrink: 0;
    }
    .app-bar-title {
      font-size: 18px; font-weight: 700;
      background: linear-gradient(135deg, #c084fc, #818cf8, #67e8f9);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
    }
    .btn-back {
      background: none; border: none;
      color: var(--text); font-size: 26px; line-height: 1;
      cursor: pointer; padding: 2px 6px 2px 0;
      opacity: 0.75; font-family: inherit;
    }

    /* ── Scroll area ── */
    .scroll-area {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    .scroll-area::-webkit-scrollbar { display: none; }

    /* ── Bottom bar ── */
    .bottom-bar {
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: rgba(11,11,30,0.82);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .btn-primary {
      width: 100%; height: 52px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 14px;
      background: rgba(255,255,255,0.10);
      color: var(--text);
      font-size: 15px; font-weight: 600; font-family: inherit;
      cursor: pointer; letter-spacing: -0.01em;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-primary:active:not(:disabled) {
      background: rgba(255,255,255,0.16);
      transform: scale(0.97);
    }
    .btn-primary:disabled { opacity: 0.38; cursor: default; }

    /* ── ① Home screen ── */
    /* Onboarding */
    .onboarding {
      flex: 1; display: flex; flex-direction: column;
      justify-content: flex-end;
    }
    .onboarding-bubbles {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; padding: 16px 20px; gap: 0;
    }
    .onboarding-footer {
      padding: 0 20px 20px;
    }
    .onboarding-footer p:first-child {
      font-size: 15px; font-weight: 700; line-height: 1.5; margin-bottom: 5px;
    }
    .onboarding-footer p:last-child {
      font-size: 13px; color: var(--muted);
    }

    /* Diary list */
    .list-title {
      font-size: 20px; font-weight: 700;
      padding: 8px 20px 16px;
    }
    .entry-item {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.12s;
    }
    .entry-item:active { background: rgba(255,255,255,0.04); }
    .entry-info { flex: 1; min-width: 0; }
    .entry-date {
      font-size: 11px; color: var(--muted);
      margin-bottom: 3px; letter-spacing: 0.02em;
    }
    .entry-preview {
      font-size: 14px; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 6px;
    }
    .entry-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px;
    }
    .badge-dot {
      width: 14px; height: 14px; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px;
    }
    .entry-chevron { color: var(--dim); font-size: 18px; flex-shrink: 0; }

    /* ── ② Write screen ── */
    .write-body {
      flex: 1; padding: 4px 20px 12px;
      display: flex; flex-direction: column;
    }
    .write-label {
      font-size: 20px; font-weight: 700; line-height: 1.4;
      margin-bottom: 20px;
    }
    .write-input-wrap {
      flex: 1; display: flex; flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }
    .write-input-wrap textarea {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text); font-size: 15px; line-height: 1.78;
      resize: none; font-family: inherit;
      caret-color: var(--purple);
    }
    .write-input-wrap textarea::placeholder { color: var(--dim); }
    .char-count {
      text-align: right; font-size: 11px; color: var(--dim); margin-top: 8px;
    }

    /* ── ③ Dialogue screen ── */
    .dialogue-area {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 4px 0 12px;
    }
    .dialogue-area::-webkit-scrollbar { display: none; }

    /* Summary button — right-aligned in bottom bar */
    .bottom-bar-right {
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: rgba(11,11,30,0.82);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      display: flex; justify-content: flex-end;
    }
    .btn-summarize {
      padding: 14px 22px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 14px;
      color: var(--text);
      font-size: 14px; font-weight: 600; font-family: inherit;
      cursor: pointer;
      opacity: 0; transform: translateY(6px);
      transition: opacity 0.3s, transform 0.3s, background 0.15s;
      pointer-events: none;
    }
    .btn-summarize.visible {
      opacity: 1; transform: translateY(0);
      pointer-events: auto;
    }
    .btn-summarize:active { background: rgba(255,255,255,0.16); }

    /* ── Cell bubble ── */
    .bubble-group {
      display: flex; gap: 10px;
      padding: 0 16px;
      margin-bottom: 14px;
      animation: bubbleIn 0.28s cubic-bezier(0.22,1,0.36,1) forwards;
      opacity: 0;
    }
    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(10px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .bubble-group.left  { flex-direction: row; }
    .bubble-group.right { flex-direction: row-reverse; }

    .cell-ava {
      width: 40px; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0; align-self: flex-start;
    }

    .bubble-col {
      display: flex; flex-direction: column; gap: 5px;
      max-width: calc(100% - 54px);
    }
    .bubble-group.right .bubble-col { align-items: flex-end; }

    .bubble-name {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.04em; padding: 0 3px;
    }

    .bubble-msg {
      padding: 10px 14px;
      border-radius: 14px; border: 1px solid;
      font-size: 14px; line-height: 1.68; color: var(--text);
      max-width: 268px; word-break: break-all;
    }

    /* Typing indicator */
    .typing-bubble {
      animation: bubbleIn 0.2s ease forwards; opacity: 0;
    }
    .typing-dots {
      display: flex; gap: 5px;
      padding: 12px 14px;
      border-radius: 14px; border: 1px solid var(--border);
      background: var(--surface);
    }
    .typing-dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted);
      animation: dot 1.3s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot {
      0%,60%,100% { transform: translateY(0); opacity: 0.3; }
      30%          { transform: translateY(-5px); opacity: 1; }
    }

    /* Cell color tokens */
    .av-anxiety    { background: rgba(192,132,252,0.18); }
    .av-anger      { background: rgba(248,113,113,0.18); }
    .av-reason     { background: rgba(147,197,253,0.18); }
    .av-avoidance  { background: rgba(148,163,184,0.14); }
    .av-desire     { background: rgba(253,186,116,0.18); }
    .av-love       { background: rgba(249,168,212,0.18); }

    .nm-anxiety    { color: var(--purple); }
    .nm-anger      { color: var(--red); }
    .nm-reason     { color: var(--blue); }
    .nm-avoidance  { color: var(--gray); }
    .nm-desire     { color: var(--orange); }
    .nm-love       { color: var(--pink); }

    .msg-anxiety   { background: rgba(192,132,252,0.10); border-color: rgba(192,132,252,0.20); }
    .msg-anger     { background: rgba(248,113,113,0.10); border-color: rgba(248,113,113,0.20); }
    .msg-reason    { background: rgba(147,197,253,0.10); border-color: rgba(147,197,253,0.20); }
    .msg-avoidance { background: rgba(148,163,184,0.08); border-color: rgba(148,163,184,0.16); }
    .msg-desire    { background: rgba(253,186,116,0.10); border-color: rgba(253,186,116,0.20); }
    .msg-love      { background: rgba(249,168,212,0.10); border-color: rgba(249,168,212,0.20); }

    /* ── ④ Result screen ── */
    .tabs-bar {
      display: flex;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tab-btn {
      padding: 12px 0; margin-right: 28px;
      background: none; border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-size: 14px; font-weight: 600; font-family: inherit;
      cursor: pointer;
      position: relative; top: 1px;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--purple); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* 하루 요약 tab */
    .summary-block {
      display: flex; gap: 14px;
      padding: 20px;
    }
    .sum-ava {
      width: 40px; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }
    .sum-body { flex: 1; }
    .sum-label {
      font-size: 14px; font-weight: 700; margin-bottom: 8px;
    }
    .sum-text {
      font-size: 13px; line-height: 1.8; color: var(--muted);
    }
    .summary-divider {
      height: 1px; background: var(--border); margin: 0 20px;
    }
    .summary-sentence {
      margin: 16px 20px 0;
      padding: 14px 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: 14px; line-height: 1.7; color: var(--muted);
      font-style: italic;
    }

    /* 세포 대화 tab static bubbles */
    .static-dialogue { padding: 8px 0 24px; }

    /* ── ⑤ Entry detail screen ── */
    .entry-detail-body {
      flex: 1; overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 8px 20px 32px;
    }
    .entry-detail-body::-webkit-scrollbar { display: none; }

    .detail-hero {
      display: flex; gap: 14px; margin-bottom: 20px;
    }
    .detail-ava {
      width: 52px; height: 52px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; flex-shrink: 0;
    }
    .detail-meta { flex: 1; }
    .detail-date {
      font-size: 12px; color: var(--muted); margin-bottom: 6px;
    }
    .detail-summary {
      font-size: 15px; font-weight: 700; line-height: 1.5; color: var(--text);
    }
    .detail-divider { height: 1px; background: var(--border); margin-bottom: 20px; }
    .detail-content {
      font-size: 14px; line-height: 1.85; color: rgba(255,255,255,0.65);
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <!-- ① Home -->
  <div id="screen-home" class="screen active">
    <div class="app-bar">
      <span class="app-bar-title">감정세포</span>
    </div>

    <!-- Onboarding (empty state) -->
    <div id="onboarding" class="onboarding">
      <div class="onboarding-bubbles" id="onboarding-bubbles"></div>
      <div class="onboarding-footer">
        <p>일기를 쓰면 내 감정세포들의 대화를 볼 수 있어요</p>
        <p>내 안의 다양한 목소리를 들어보세요.</p>
      </div>
    </div>

    <!-- Diary list (has entries) -->
    <div id="diary-list-view" class="scroll-area" style="display:none;">
      <div class="list-title">내가 쓴 일기</div>
      <div id="entries-container"></div>
    </div>

    <div class="bottom-bar">
      <button class="btn-primary" id="btn-write">오늘의 일기 쓰기</button>
    </div>
  </div>

  <!-- ② Write -->
  <div id="screen-write" class="screen">
    <div class="app-bar">
      <button class="btn-back" id="write-back">‹</button>
    </div>
    <div class="write-body">
      <div class="write-label">오늘은 어떤 일이 있었나요?</div>
      <div class="write-input-wrap">
        <textarea id="diary-input" placeholder="기억에 남는 일과 기분을 적어주세요" maxlength="1000"></textarea>
        <div class="char-count"><span id="char-num">0</span> /1000</div>
      </div>
    </div>
    <div class="bottom-bar">
      <button class="btn-primary" id="btn-submit">세포들 깨우기</button>
    </div>
  </div>

  <!-- ③ Dialogue (streaming) -->
  <div id="screen-dialogue" class="screen">
    <div class="app-bar">
      <button class="btn-back" id="dialogue-back">‹</button>
    </div>
    <div class="dialogue-area" id="dialogue-list"></div>
    <div class="bottom-bar-right">
      <button class="btn-summarize" id="btn-to-result">하루 요약하기 ›</button>
    </div>
  </div>

  <!-- ④ Result (tabbed) -->
  <div id="screen-result" class="screen">
    <div class="app-bar">
      <button class="btn-back" id="result-back">‹</button>
    </div>
    <div class="tabs-bar">
      <button class="tab-btn active" data-tab="tab-summary">하루 요약</button>
      <button class="tab-btn" data-tab="tab-dialogue">세포 대화</button>
    </div>
    <div class="scroll-area">
      <div id="tab-summary" class="tab-panel active"></div>
      <div id="tab-dialogue" class="tab-panel"></div>
    </div>
  </div>

  <!-- ⑤ Entry detail -->
  <div id="screen-entry" class="screen">
    <div class="app-bar">
      <button class="btn-back" id="entry-back">‹</button>
    </div>
    <div class="entry-detail-body" id="entry-detail-body"></div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
